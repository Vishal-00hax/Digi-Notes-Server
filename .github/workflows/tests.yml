name: Backend Test Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Agar naya push aa jaaye purane wale ke chalte hue, to purana
# k6 run cancel kar do -- taaki ek saath 2 load tests na chalein
# aur free tier app par double load na pade
concurrency:
  group: k6-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - run: npm test

  k6-load-test:
    # Ye job SIRF tab chalega jab:
    # 1. test-backend job successfully pass ho chuka ho
    # 2. Event "push" ho (pull_request nahi -- forks ke
    #    liye secrets available nahi hote, isliye login
    #    fail ho jayega)
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------
      # Render free tier app 15 min inactivity ke baad so jaata hai. Pehle
      # hum sirf `sleep 40` karte the aur frontend URL ko ping karte the --
      # usse Render backend kabhi warm hi nahi hota tha, isliye login (pehla
      # backend call) 30-50 sec cold start khata tha aur p95 threshold fail
      # ho jaata tha. Ab hum backend ke /api/health/ready endpoint ko tab tak
      # poll karte hain jab tak wo 200 (DB connected) na de de.
      # ------------------------------------------
      - name: Warm up backend (poll until ready)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail

          # Same sanitizing as the k6 scripts: strip brackets, quotes,
          # whitespace and trailing slashes that can sneak into secrets.
          CLEAN_URL=$(printf '%s' "$BASE_URL" | tr -d '[]"'"'"'<> \t\r\n' | sed 's#/*$##')
          case "$CLEAN_URL" in
            http://*|https://*) ;;
            *) CLEAN_URL="https://${CLEAN_URL}" ;;
          esac

          ROOT_URL="${CLEAN_URL}/"
          READY_URL="${CLEAN_URL}/api/health/ready"

          echo "Warming up frontend at ${ROOT_URL} ..."
          curl -s -o /dev/null --max-time 30 "$ROOT_URL" || true

          echo "Polling ${READY_URL} until the backend is ready..."
          for attempt in $(seq 1 36); do
            rm -f /tmp/health.json
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 15 "$READY_URL" || true)
            body=$(cat /tmp/health.json 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "Backend ready after ${attempt} attempt(s): ${body}"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code:-000} - ${body}"
            sleep 5
          done

          echo "Backend did not become ready within the timeout."
          exit 1

      - name: Run k6 - Auth + Read Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6-tests/load-test-auth.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      # ⚠️ Ye test OpenAI embedding calls karta hai -- real
      # cost lagti hai har run par. Chunki aapne "automatic
      # on every push" choose kiya hai, dhyan rakhna ki
      # main branch par kitni baar push ho raha hai.
      - name: Run k6 - Notes Write Test (Cost Warning)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6-tests/notes-write-test.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
